# Aktualizacja indeksu, feedu i cen co godzinę + publikacja na Hostingerze. Dzienny wpis na Telegramie i dane mapy schronów: raz dziennie (04 UTC).
name: Aktualizacja i publikacja

on:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pobierz dane i przelicz indeks
        if: github.event_name != 'push'
        run: node scripts/update-data.mjs

      - name: Zapisz nowe dane w repozytorium
        if: github.event_name != 'push'
        run: |
          git config user.name "prepready-bot"
          git config user.email "bot@prepready.pro"
          git add src/data/readiness.json src/data/feed.json src/data/supply.json
          git diff --cached --quiet || git commit -m "Dane: aktualizacja $(date -u '+%F %H:%M') UTC"
          git pull --rebase --autostash -q || true
          git push

      - name: Data dla pamięci podręcznej danych PSP
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Pamięć pliku PSP (pobieramy go raz dziennie, nie co godzinę)
        uses: actions/cache@v4
        with:
          path: /tmp/ps
          key: shelters-${{ steps.day.outputs.d }}

      - name: Mapa schronów — dane startowe (KG PSP, dane.gov.pl, CC BY 4.0)
        continue-on-error: true
        run: |
          mkdir -p /tmp/ps
          if [ ! -s /tmp/ps/ps.csv ]; then
            # Najpierw świeży plik PSP (często blokuje IP spoza PL), potem kopia na dane.gov.pl.
            if curl -fsSL --max-time 60 -o /tmp/ps/ps.csv https://gdziesieukryc.pl/PS_XML/punkty_schronienia.csv; then date -u +%F > /tmp/ps/date
            elif curl -fsSL --max-time 300 -o /tmp/ps/ps.csv https://api.dane.gov.pl/media/resources/20260310/punkty_schronienia_875cc428.csv; then echo 2026-03-10 > /tmp/ps/date
            fi
          fi
          [ -s /tmp/ps/ps.csv ] && node scripts/shelters.mjs /tmp/ps/ps.csv "$(cat /tmp/ps/date)"

      - run: npm run build

      - name: Adres do formularza kontaktowego (z sekretu, nie z kodu)
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          printf "<?php return ['to' => '%s'];\n" "$CONTACT_EMAIL" > dist/contact-config.php

      - name: Boty Telegram PL i EN — tokeny i dane dla webhooków (z sekretów, nie z kodu)
        env:
          TG_BOT_PL_TOKEN: ${{ secrets.TG_BOT_PL_TOKEN }}
          TG_BOT_EN_TOKEN: ${{ secrets.TG_BOT_EN_TOKEN }}
        run: |
          mkdir -p dist/tg
          printf "<?php return ['pl' => '%s', 'en' => '%s'];\n" "$TG_BOT_PL_TOKEN" "$TG_BOT_EN_TOKEN" > dist/tg/config.php
          cp src/data/readiness.json dist/tg/readiness.json

      - name: Wyślij na Hostingera (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false

      - name: Mapa schronów — cotygodniowe dane PSP (pobiera serwer w Polsce/UE; sam pilnuje, by robić to raz na 6 dni)
        continue-on-error: true
        run: curl -sS --max-time 150 https://prepready.pro/schrony/aktualizuj.php || true

      - name: Podłącz webhooki botów PL i EN
        env:
          TG_BOT_PL_TOKEN: ${{ secrets.TG_BOT_PL_TOKEN }}
          TG_BOT_EN_TOKEN: ${{ secrets.TG_BOT_EN_TOKEN }}
        run: |
          hook() {
            [ -z "$2" ] && { echo "$1: brak tokena — pomijam."; return 0; }
            SECRET=$(printf "prepready-%s:%s" "$1" "$2" | sha256sum | cut -c1-48)
            curl -s -o /dev/null -w "$1 setWebhook HTTP %{http_code}\n" "https://api.telegram.org/bot$2/setWebhook" \
              -d url=https://prepready.pro/tg/$1.php -d secret_token="$SECRET" \
              --data-urlencode 'allowed_updates=["message"]'
          }
          hook pl "$TG_BOT_PL_TOKEN"
          hook en "$TG_BOT_EN_TOKEN"
