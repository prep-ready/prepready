# Codzienna aktualizacja indeksu i feedu + publikacja na Hostingerze.
name: Aktualizacja i publikacja

on:
  schedule:
    - cron: '47 4 * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pobierz dane i przelicz indeks
        if: github.event_name != 'push'
        run: node scripts/update-data.mjs

      - name: Zapisz nowe dane w repozytorium
        if: github.event_name != 'push'
        run: |
          git config user.name "prepready-bot"
          git config user.email "bot@prepready.pro"
          git add src/data/readiness.json src/data/feed.json
          git diff --cached --quiet || git commit -m "Dane: aktualizacja $(date -u +%F)"
          git push

      - run: npm run build

      - name: Adres do formularza kontaktowego (z sekretu, nie z kodu)
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          printf "<?php return ['to' => '%s'];\n" "$CONTACT_EMAIL" > dist/contact-config.php

      - name: Bot Telegram PL — token i dane dla webhooka (z sekretu, nie z kodu)
        env:
          TG_BOT_PL_TOKEN: ${{ secrets.TG_BOT_PL_TOKEN }}
        run: |
          mkdir -p dist/tg
          printf "<?php return ['pl' => '%s'];\n" "$TG_BOT_PL_TOKEN" > dist/tg/config.php
          cp src/data/readiness.json dist/tg/readiness.json

      - name: Dzienny indeks w temacie Alerty
        if: github.event_name == 'schedule'
        env:
          TG_BOT_PL_TOKEN: ${{ secrets.TG_BOT_PL_TOKEN }}
        run: node scripts/telegram-post.mjs

      - name: Wyślij na Hostingera (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false

      - name: Podłącz webhook bota PL
        env:
          TG_BOT_PL_TOKEN: ${{ secrets.TG_BOT_PL_TOKEN }}
        run: |
          [ -z "$TG_BOT_PL_TOKEN" ] && { echo "Brak tokena — pomijam."; exit 0; }
          SECRET=$(printf "prepready-pl:%s" "$TG_BOT_PL_TOKEN" | sha256sum | cut -c1-48)
          curl -s -o /dev/null -w "setWebhook HTTP %{http_code}\n" "https://api.telegram.org/bot${TG_BOT_PL_TOKEN}/setWebhook" \
            -d url=https://prepready.pro/tg/pl.php -d secret_token="$SECRET" \
            --data-urlencode 'allowed_updates=["message"]'
