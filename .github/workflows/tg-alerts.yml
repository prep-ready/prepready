# Alerty IMGW do grupy Telegram @prepreadyPL (temat 🚨 Alerty), co 30 minut.
name: Alerty Telegram

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

concurrency:
  group: tg-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Przywróć pamięć wysłanych alertów
        uses: actions/cache/restore@v4
        with:
          path: .tg-alerts-state.json
          key: tg-alerts-${{ github.run_id }}
          restore-keys: tg-alerts-
      - name: Wyślij nowe ostrzeżenia
        env:
          TG_BOT_PL_TOKEN: ${{ secrets.TG_BOT_PL_TOKEN }}
        run: node scripts/tg-alerts.mjs
      - name: Zapisz pamięć
        uses: actions/cache/save@v4
        with:
          path: .tg-alerts-state.json
          key: tg-alerts-${{ github.run_id }}
